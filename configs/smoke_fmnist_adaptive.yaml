run:
  name: smoke_fmnist_adaptive
  seed: 0
  results_dir: results
  data_root: data
workload:
  dataset: fashion_mnist
  model: small_cnn
  batch_size: 128
  num_workers: 3
  lr: 0.05
  lr_decay_frac: 0.5
  max_updates: 2500
  max_wall_time_s: 480
  eval_interval: 250
heterogeneity:
  compute_delay: {1: 0.3}
  comm_delay_ms: 0
compression:
  mode: topk
  rho: 0.25
staleness:
  enabled: true
  s_low: 1
  s_max: 4
  beta: 0.5
error_feedback:
  enabled: true
controller:
  enabled: true
  interval_s: 8
  policy: threshold
