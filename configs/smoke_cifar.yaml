run:
  name: smoke_cifar
  seed: 0
  results_dir: results
  data_root: data
workload:
  dataset: cifar10
  model: resnet18
  batch_size: 128
  num_workers: 3
  lr: 0.02
  lr_decay_frac: 0.5
  max_updates: 600
  max_wall_time_s: 1800
  eval_interval: 200
heterogeneity:
  compute_delay: {1: 0.5, 2: 1.5}
  comm_delay_ms: 0
compression:
  mode: identity
