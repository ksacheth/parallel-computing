# Ablation: adaptive controller without error feedback — isolates EF's role
# in making the controller's aggressive compression survivable.
run:
  name: cifar_adaptive_no_ef
  seed: 0
  results_dir: results
  data_root: data
workload:
  dataset: cifar10
  model: resnet18
  batch_size: 128
  num_workers: 3
  lr: 0.02
  lr_decay_frac: 0.5
  max_updates: 6000
  max_wall_time_s: 21600
  eval_interval: 500
  target_accuracy: 0.80
heterogeneity:
  compute_delay: {1: 0.5, 2: 1.5}
  comm_delay_ms: 0
compression:
  mode: topk
  rho: 0.25
staleness:
  enabled: true
  s_low: 1
  s_max: 4
  beta: 0.5
error_feedback:
  enabled: false
controller:
  enabled: true
  interval_s: 30
  policy: threshold
