run:
  name: smoke_fmnist_sync
  seed: 0
  results_dir: results
  data_root: data
workload:
  dataset: fashion_mnist
  model: small_cnn
  batch_size: 128
  num_workers: 3
  lr: 0.05
  lr_decay_frac: 0.5
  max_updates: 600
  max_wall_time_s: 600
  eval_interval: 200
  sync: true
heterogeneity:
  compute_delay: {1: 0.05}
  comm_delay_ms: 0
compression:
  mode: identity
