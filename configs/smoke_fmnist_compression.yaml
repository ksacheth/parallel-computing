run:
  name: smoke_fmnist_compression
  seed: 0
  results_dir: results
  data_root: data
workload:
  dataset: fashion_mnist
  model: small_cnn
  batch_size: 128
  num_workers: 3
  lr: 0.05
  lr_decay_frac: 0.5
  max_updates: 3000
  max_wall_time_s: 480
  eval_interval: 500
heterogeneity:
  compute_delay: {}
  comm_delay_ms: 0
compression:
  mode: topk
  rho: 0.25
